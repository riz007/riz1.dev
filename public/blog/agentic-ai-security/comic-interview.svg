  <circle cx="70" cy="150" r="17" fill="#f1e4d3" stroke="#1c1916" stroke-width="1.5"/>
  <path d="M53 148 Q54 130 70 131 Q87 130 87 146 Q80 139 70 140 Q60 139 53 148 Z" fill="#1c1916"/>
