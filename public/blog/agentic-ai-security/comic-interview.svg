  <text class="mono" x="26" y="71" font-size="10" fill="#1c1916">September</text>
  <rect class="bub" x="112" y="82" width="116" height="50" rx="6"/>
  <text class="mono ink2" x="120" y="97" font-size="9.5">New message</text>
  <text class="serif" x="120" y="112" font-size="11.5">Loved your wallet</text>
  <text class="serif" x="120" y="126" font-size="11.5">work. Quick chat?</text>
  <rect class="bub" x="24" y="96" width="46" height="22" rx="11"/>
  <polygon points="48,116 58,116 56,128" fill="#fdfcfa"/>
  <polyline class="line" points="49,117.5 56,128 57,117.5" stroke-width="1.2"/>
  <text class="serif" x="47" y="111" font-size="12" text-anchor="middle">Ooh.</text>
