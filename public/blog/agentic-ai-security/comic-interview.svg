  <path d="M273 352 Q274 334 290 335 Q307 334 307 350 Q300 343 290 344 Q280 343 273 352 Z" fill="#1c1916"/>
  <circle cx="294" cy="356" r="4.5" fill="none" stroke="#1c1916" stroke-width="1.2"/>
  <circle cx="305" cy="356" r="4.5" fill="none" stroke="#1c1916" stroke-width="1.2"/>
  <path class="line" d="M298.5 356 H300.5" stroke-width="1.2"/>
  <path class="line" d="M295 366 Q299 368 303 366"/>
  <rect x="330" y="336" width="104" height="70" rx="3" fill="#1c1916"/>
  <text class="scr" x="338" y="354" font-size="9.5">$ ./take_home</text>
  <text class="scr" x="338" y="370" font-size="9.5">running...</text>
  <text class="scr" x="338" y="386" font-size="9.5">done.</text>
  <path d="M322 416 L326 407 L438 407 L442 416 Z" fill="#a39b8f" stroke="#1c1916" stroke-width="1.5"/>
  <circle cx="430" cy="326" r="6" fill="#b85c38" stroke="#1c1916" stroke-width="1.2"/>
  <circle cx="444" cy="308" r="6" fill="#b85c38" stroke="#1c1916" stroke-width="1.2"/>
  <circle cx="452" cy="288" r="6" fill="#b85c38" stroke="#1c1916" stroke-width="1.2"/>
  <circle cx="418" cy="304" r="5" fill="#b85c38" stroke="#1c1916" stroke-width="1.2"/>
  <text class="serif" x="404" y="296" font-size="16" text-anchor="end">$6.3B</text>
  <line class="line" x1="244" y1="418" x2="468" y2="418"/>

  <text class="mono ink2" x="16" y="474" font-size="11">Same playbook as Bybit in 2025:</text>
  <text class="mono ink2" x="16" y="490" font-size="11">get onto a developer's laptop first.</text>
</svg>
