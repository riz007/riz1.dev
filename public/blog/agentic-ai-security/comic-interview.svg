  <text class="serif" x="356" y="224" font-size="12.5" text-anchor="middle">We love your profile!</text>

  <rect class="panel" x="12" y="254" width="224" height="196" rx="3"/>
  <rect x="26" y="266" width="196" height="122" rx="6" fill="#1c1916"/>
  <path d="M84 388 Q88 352 124 346 Q160 352 164 388 Z" fill="#3d3833"/>
  <path d="M112 348 L124 372 L136 348 Z" fill="#fdfcfa"/>
