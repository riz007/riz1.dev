  <text class="serif" x="124" y="421" font-size="12" text-anchor="middle">Last step: a small take-home.</text>

  <rect class="panel" x="244" y="254" width="224" height="196" rx="3"/>
  <rect class="cap" x="252" y="262" width="80" height="18"/>
  <text class="mono" x="258" y="275" font-size="10" fill="#1c1916">Weeks later</text>
