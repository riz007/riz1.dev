  <path class="line" d="M78.5 152 H80.5" stroke-width="1.2"/>
  <path class="line" d="M74 162 Q78 165 82 162"/>
  <path d="M98 192 L124 202" stroke="#c9bfb1" stroke-width="7" stroke-linecap="round"/>
