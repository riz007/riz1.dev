<svg xmlns="http://www.w3.org/2000/svg" width="480" height="506" viewBox="0 0 480 506" role="img" aria-labelledby="t d">
  <title id="t">The interview</title>
  <desc id="d">A four-panel comic. Panel one, September: an engineer with glasses gets a message, "Loved your wallet work. Quick chat?", and says "Ooh." Panel two: a video call with a smiling recruiter labelled HR, round one, saying "We love your profile!" Panel three: a video call with a man in a suit and tie labelled CEO, round two, saying "Last step: a small take-home." Panel four, weeks later: the engineer runs the take-home task on a laptop while coins fly out of the screen, labelled 6.3 billion dollars.</desc>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#1c1916}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .ink2{fill:#6b655c}
    .panel{fill:#fdfcfa;stroke:#1c1916;stroke-width:1.5}
    .line{fill:none;stroke:#1c1916;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .scr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f3efe7}
    .cap{fill:#efe9e0;stroke:#1c1916;stroke-width:1}
    .bub{fill:#fdfcfa;stroke:#1c1916;stroke-width:1.2}
    .tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1c1916}
  </style>
  <rect width="480" height="506" rx="6" fill="#f8f5f0"/>
  <rect x="0.5" y="0.5" width="479" height="505" rx="6" fill="none" stroke="#e4ddd2"/>

  <text class="serif" x="16" y="34" font-size="19">The interview</text>
  <text class="mono ink2" x="464" y="34" font-size="10.5" text-anchor="end">based on Binance's own report</text>

