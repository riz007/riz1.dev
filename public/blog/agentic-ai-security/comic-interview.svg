  <rect x="258" y="62" width="196" height="132" rx="6" fill="#1c1916"/>
  <path d="M318 194 Q322 160 356 154 Q390 160 394 194 Z" fill="#b85c38"/>
  <path d="M330 140 Q326 98 356 96 Q386 98 382 140 Q378 120 356 118 Q334 120 330 140 Z" fill="#6b655c"/>
