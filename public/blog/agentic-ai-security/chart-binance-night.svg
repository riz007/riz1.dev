<svg xmlns="http://www.w3.org/2000/svg" width="480" height="492" viewBox="0 0 480 492" role="img" aria-labelledby="t d">
  <title id="t">The freeze took an hour. The revoke took four.</title>
  <desc id="d">The night of 29 October 2026 in UTC. 20:05 the drain begins. 20:24 one transaction moves over 2.5 billion dollars. 21:01 Tether freezes stablecoins and Circle follows at 21:04. 22:06 Tether blocks the hot wallet. 23:05 Avalanche and Polygon are hit. 23:53 Circle blocks the hot wallet. 00:10 Binance revokes the attackers' access. 56 minutes from first theft to first freeze; 4 hours 5 minutes to access revoked.</desc>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#1c1916}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .ink{fill:#1c1916}.ink2{fill:#6b655c}
  </style>
  <rect width="480" height="492" rx="6" fill="#f8f5f0"/>
  <rect x="0.5" y="0.5" width="479" height="491" rx="6" fill="none" stroke="#e4ddd2"/>

  <text class="serif" x="24" y="36" font-size="18">The freeze took an hour. The revoke took four.</text>
  <text class="mono ink2" x="24" y="58" font-size="11.5">The night of 29 October 2026, UTC</text>

  <circle cx="30" cy="84" r="5" fill="#b85c38" stroke="#f8f5f0" stroke-width="2"/>
  <text class="mono ink2" x="42" y="88" font-size="11">attacker</text>
  <circle cx="122" cy="84" r="5" fill="#f8f5f0" stroke="#6b655c" stroke-width="2"/>
  <text class="mono ink2" x="134" y="88" font-size="11">response</text>

  <line x1="130" y1="104" x2="130" y2="386" stroke="#d8d0c4" stroke-width="1.5"/>

  <text class="mono ink2" x="116" y="114" font-size="11.5" text-anchor="end">20:05</text>
  <circle cx="130" cy="110" r="5" fill="#b85c38" stroke="#f8f5f0" stroke-width="2"/>
  <text class="serif" x="146" y="114" font-size="13">Drain begins</text>

  <text class="mono ink2" x="116" y="135" font-size="11.5" text-anchor="end">20:24</text>
  <circle cx="130" cy="131" r="5" fill="#b85c38" stroke="#f8f5f0" stroke-width="2"/>
  <text class="serif" x="146" y="135" font-size="13">One transaction moves over $2.5B</text>

  <text class="mono ink2" x="116" y="176" font-size="11.5" text-anchor="end">21:01</text>
  <circle cx="130" cy="172" r="5" fill="#f8f5f0" stroke="#6b655c" stroke-width="2"/>
  <text class="serif" x="146" y="176" font-size="13">Tether freezes. Circle follows at 21:04</text>

  <text class="mono ink2" x="116" y="247" font-size="11.5" text-anchor="end">22:06</text>
  <circle cx="130" cy="243" r="5" fill="#f8f5f0" stroke="#6b655c" stroke-width="2"/>
  <text class="serif" x="146" y="247" font-size="13">Tether blocks the hot wallet</text>

  <text class="mono ink2" x="116" y="312" font-size="11.5" text-anchor="end">23:05</text>
  <circle cx="130" cy="308" r="5" fill="#b85c38" stroke="#f8f5f0" stroke-width="2"/>
  <text class="serif" x="146" y="312" font-size="13">Avalanche and Polygon hit</text>

  <text class="mono ink2" x="116" y="365" font-size="11.5" text-anchor="end">23:53</text>
  <circle cx="130" cy="361" r="5" fill="#f8f5f0" stroke="#6b655c" stroke-width="2"/>
  <text class="serif" x="146" y="365" font-size="13">Circle blocks the hot wallet</text>

  <text class="mono ink2" x="116" y="384" font-size="11.5" text-anchor="end">00:10</text>
  <circle cx="130" cy="380" r="5" fill="#f8f5f0" stroke="#6b655c" stroke-width="2"/>
  <text class="serif" x="146" y="384" font-size="13">Binance revokes the attackers' access</text>

  <line x1="24" y1="402" x2="456" y2="402" stroke="#e4ddd2"/>
  <text class="serif" x="24" y="426" font-size="15" font-weight="bold">56 min</text>
  <text class="mono ink2" x="130" y="425" font-size="11">first theft to first freeze</text>
  <text class="serif" x="24" y="446" font-size="15" font-weight="bold">4 h 05 min</text>
  <text class="mono ink2" x="130" y="445" font-size="11">first theft to attacker access revoked</text>

  <text class="mono ink2" x="24" y="470" font-size="10.5">Halting withdrawals didn't stop it: the permission lived on-chain.</text>
  <text class="mono ink2" x="24" y="485" font-size="10.5">Sources: TRM Labs, Chainalysis, Wikipedia's reconstruction.</text>
</svg>
