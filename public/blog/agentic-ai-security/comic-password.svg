<svg xmlns="http://www.w3.org/2000/svg" width="480" height="506" viewBox="0 0 480 506" role="img" aria-labelledby="t d">
  <title id="t">The password</title>
  <desc id="d">A four-panel comic. Panel one, 2:14 a.m. on 11 October: a person in a hoodie at a laptop showing a refrigeration controller login, saying "Username? admin." Panel two: they turn to look at a wall calendar showing 11 October, thinking "Password... hm." Panel three: the screen reads access granted, welcome admin, and someone asks "That's it?" Panel four, six hours later: a supermarket fridge is steaming and dripping beside a thermometer reading 50 degrees Celsius.</desc>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#1c1916}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .ink2{fill:#6b655c}
    .panel{fill:#fdfcfa;stroke:#1c1916;stroke-width:1.5}
    .line{fill:none;stroke:#1c1916;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .scr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f3efe7}
    .cap{fill:#efe9e0;stroke:#1c1916;stroke-width:1}
    .bub{fill:#fdfcfa;stroke:#1c1916;stroke-width:1.2}
  </style>
  <rect width="480" height="506" rx="6" fill="#f8f5f0"/>
  <rect x="0.5" y="0.5" width="479" height="505" rx="6" fill="none" stroke="#e4ddd2"/>

  <text class="serif" x="16" y="34" font-size="19">The password</text>
  <text class="mono ink2" x="464" y="34" font-size="10.5" text-anchor="end">based on CVE-2025-41450</text>

