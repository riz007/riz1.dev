  <polygon points="56,108 74,108 64,123" fill="#fdfcfa"/>
  <polyline class="line" points="57,109.5 64,123 73,109.5" stroke-width="1.2"/>
  <text class="serif" x="76" y="101" font-size="12" text-anchor="middle">Username? admin.</text>
  <path d="M46 168 Q42 124 70 122 Q98 124 94 168 Z" fill="#6b655c" stroke="#1c1916" stroke-width="1.5"/>
  <path d="M40 214 Q42 176 70 170 Q98 176 100 214 Z" fill="#6b655c" stroke="#1c1916" stroke-width="1.5"/>
  <circle cx="71" cy="152" r="15" fill="#f1e4d3" stroke="#1c1916" stroke-width="1.5"/>
  <circle cx="76" cy="150" r="1.7" fill="#1c1916"/>
  <circle cx="83" cy="150" r="1.7" fill="#1c1916"/>
  <path class="line" d="M76 160 H82"/>
  <path d="M96 190 L122 200" stroke="#6b655c" stroke-width="7" stroke-linecap="round"/>
  <rect x="124" y="134" width="92" height="68" rx="3" fill="#1c1916"/>
  <text class="scr" x="132" y="152" font-size="9.5">AK-SM 800</text>
  <text class="scr" x="132" y="170" font-size="9.5">user: admin</text>
  <text class="scr" x="132" y="187" font-size="9.5">pass: _</text>
  <path d="M116 212 L120 203 L220 203 L224 212 Z" fill="#a39b8f" stroke="#1c1916" stroke-width="1.5"/>
  <line class="line" x1="12" y1="214" x2="236" y2="214"/>

  <rect class="panel" x="244" y="50" width="224" height="196" rx="3"/>
  <rect x="258" y="72" width="64" height="72" fill="#fdfcfa" stroke="#1c1916" stroke-width="1.5"/>
  <rect x="258" y="72" width="64" height="18" fill="#b85c38" stroke="#1c1916" stroke-width="1.5"/>
  <text class="mono" x="290" y="85" font-size="10" fill="#fdfcfa" text-anchor="middle">OCT</text>
  <text class="serif" x="290" y="130" font-size="30" text-anchor="middle">11</text>
  <path class="line" d="M272 68 V76 M308 68 V76"/>
  <ellipse cx="372" cy="86" rx="46" ry="18" class="bub"/>
  <text class="serif" x="372" y="90" font-size="11.5" text-anchor="middle">Password... hm.</text>
  <circle cx="384" cy="109" r="4.5" class="bub"/>
  <circle cx="390" cy="117" r="2.8" class="bub"/>
  <path d="M376 168 Q372 124 400 122 Q428 124 424 168 Z" fill="#6b655c" stroke="#1c1916" stroke-width="1.5"/>
  <path d="M370 214 Q372 176 400 170 Q428 176 430 214 Z" fill="#6b655c" stroke="#1c1916" stroke-width="1.5"/>
  <circle cx="399" cy="152" r="15" fill="#f1e4d3" stroke="#1c1916" stroke-width="1.5"/>
  <circle cx="387" cy="149" r="1.7" fill="#1c1916"/>
  <circle cx="394" cy="149" r="1.7" fill="#1c1916"/>
  <path class="line" d="M388 160 Q391 158 394 160"/>
  <rect x="296" y="170" width="52" height="34" rx="2" fill="#1c1916"/>
  <text class="scr" x="302" y="191" font-size="8.5">pass: _</text>
  <path d="M290 212 L293 204 L351 204 L354 212 Z" fill="#a39b8f" stroke="#1c1916" stroke-width="1.5"/>
  <line class="line" x1="244" y1="214" x2="468" y2="214"/>

  <rect class="panel" x="12" y="254" width="224" height="196" rx="3"/>
  <rect x="30" y="272" width="188" height="122" rx="5" fill="#1c1916"/>
  <text class="scr" x="44" y="298" font-size="11">user: admin</text>
  <text class="scr" x="44" y="316" font-size="11">pass: ********</text>
  <text x="44" y="348" font-size="14" font-weight="bold" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#f0b48f">ACCESS GRANTED</text>
  <text class="scr" x="44" y="370" font-size="11">Welcome, admin.</text>
  <rect x="22" y="394" width="204" height="8" rx="2" fill="#a39b8f" stroke="#1c1916" stroke-width="1.5"/>
  <rect class="bub" x="132" y="414" width="90" height="26" rx="12"/>
  <polygon points="218,422 218,434 234,428" fill="#fdfcfa"/>
  <polyline class="line" points="220,421.5 234,428 220,434.5" stroke-width="1.2"/>
  <text class="serif" x="177" y="431" font-size="12" text-anchor="middle">That's it?</text>

  <rect class="panel" x="244" y="254" width="224" height="196" rx="3"/>
  <rect class="cap" x="252" y="262" width="104" height="18"/>
  <text class="mono" x="258" y="275" font-size="10" fill="#1c1916">Six hours later</text>
  <path class="line" d="M306 298 q-5 -6 0 -12"/>
  <path class="line" d="M332 297 q-5 -6 0 -12"/>
  <path class="line" d="M362 290 q-6 -7 0 -14 q6 -7 0 -14"/>
