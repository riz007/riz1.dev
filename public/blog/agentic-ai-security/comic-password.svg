  <line class="line" x1="292" y1="370" x2="372" y2="370" stroke-width="1"/>
  <line class="line" x1="292" y1="402" x2="372" y2="402" stroke-width="1"/>
  <path d="M298 338 V326 Q306 322 314 326 V338 Z" fill="#fdfcfa" stroke="#1c1916" stroke-width="1"/>
  <path d="M322 338 V324 Q330 319 338 324 V338 Z" fill="#fdfcfa" stroke="#1c1916" stroke-width="1"/>
  <path d="M348 338 V327 Q356 322 364 327 V338 Z" fill="#fdfcfa" stroke="#1c1916" stroke-width="1"/>
  <path d="M302 370 V358 H318 V370 Z" fill="#fdfcfa" stroke="#1c1916" stroke-width="1"/>
  <path d="M330 370 V356 H346 V370 Z" fill="#fdfcfa" stroke="#1c1916" stroke-width="1"/>
  <path d="M305 338 q1 6 -1 11 M331 338 q2 7 -1 13 M356 338 q1 5 -1 9 M310 370 q1 6 -1 11 M339 370 q2 8 -1 14" fill="none" stroke="#6b655c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M296 420 q2 6 -1 10 M368 420 q2 5 0 9" fill="none" stroke="#6b655c" stroke-width="1.5" stroke-linecap="round"/>
  <text class="serif" x="420" y="292" font-size="15" text-anchor="middle">50°C</text>
  <rect x="413" y="300" width="14" height="104" rx="7" fill="#fdfcfa" stroke="#1c1916" stroke-width="1.5"/>
  <rect x="416.5" y="304" width="7" height="104" rx="3.5" fill="#b85c38"/>
  <circle cx="420" cy="412" r="12" fill="#b85c38" stroke="#1c1916" stroke-width="1.5"/>
  <line class="line" x1="244" y1="432" x2="268" y2="432"/>
  <line class="line" x1="440" y1="432" x2="468" y2="432"/>

  <text class="mono ink2" x="16" y="474" font-size="11">Danfoss shipped the fix in August 2025.</text>
  <text class="mono ink2" x="16" y="490" font-size="11">The attack came in October 2026.</text>
</svg>
